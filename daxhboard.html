  <script>
    (() => {
      const system = window.matchMedia("(prefers-color-scheme: dark)");
      let preference = null;
      try {
        const query = new URLSearchParams(location.search).get("theme");
        preference = ["light", "dark"].includes(query) ? query : (query === "system" ? null : localStorage.getItem("werd-theme"));
      } catch {}
      document.documentElement.dataset.theme = preference || (system.matches ? "dark" : "light");
    })();
  </script>
  <style>
    :root { color-scheme: light; --bg:#f5f5f7; --paper:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.12); --blue:#0066cc; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; }
    [data-theme="dark"] { color-scheme:dark; --bg:#000; --paper:#161617; --ink:#f5f5f7; --muted:#a1a1a6; --line:rgba(255,255,255,.18); --blue:#2997ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; grid-template-rows:auto 1fr; background:var(--bg); color:var(--ink); }
    header, main { width:min(100% - 44px, 980px); margin-inline:auto; }
    header { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); }
    .brand { color:inherit; text-decoration:none; font-weight:650; letter-spacing:.02em; }
    a { color:var(--blue); }
    main { align-self:center; padding-block:80px; }
    .eyebrow { margin:0 0 14px; color:var(--blue); font-size:14px; font-weight:650; }
    h1 { max-width:760px; margin:0; font-size:clamp(42px,7vw,72px); line-height:1.04; letter-spacing:-.035em; }
    p { max-width:720px; color:var(--muted); font-size:18px; line-height:1.7; }
    .archive-note { padding-top:32px; margin-top:32px; border-top:1px solid var(--line); }
    @media(max-width:600px) { header,main { width:min(100% - 32px,980px); } main { padding-block:52px; } }
  </style>
</head>
